<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Script;src:url(../../web/src/assets/fonts/MrsSaintDelafield-400.woff2)}
@font-face{font-family:Syne;src:url(../../web/src/assets/fonts/Syne-600.woff2)}
@font-face{font-family:Bodoni;src:url(../../web/src/assets/fonts/BodoniModa-400i.woff2);font-style:italic}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden}
.a{background:#4A0B18;--fg:#E0368C;--sub:#F7CAD8;--ck:rgba(224,54,140,.14)}

.wrap{width:1080px;height:1080px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:conic-gradient(var(--ck) 25%,transparent 0 50%,var(--ck) 0 75%,transparent 0) 0 0/120px 120px}

.guide{font-family:Syne;letter-spacing:.42em;color:var(--sub);font-size:60px;margin-top:50px;padding-left:.42em}
.mx{font-family:Bodoni;font-style:italic;color:var(--sub);font-size:42px;margin-top:22px;opacity:.85}
</style>
