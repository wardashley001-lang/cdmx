<!doctype html><html lang="en"><head><meta charset="utf-8"><title>La Güera's Guide: carousel templates</title>
<style>
@page{size:1080px 1350px;margin:0}
:root{--wine:#4A0B18;--deep:#2A0710;--pink:#E0368C;--rosa:#F7CAD8;--cream:#FFF8F7;--nude:#DDB9A6}
*{margin:0;box-sizing:border-box}
body{background:#777}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;page-break-after:always;font-family:"DM Sans"}
.s:last-child{page-break-after:auto}
.wine{background:var(--wine);color:var(--rosa)}
.pinkbg{background:var(--rosa);color:var(--deep)}
.creamb{background:var(--cream);color:var(--deep)}
.chk{background-image:url(https://raw.githubusercontent.com/wardashley001-lang/cdmx/main/brand/kit/patterns/checker-subtle-on-wine.png);background-size:180px 180px}
.chkp{background-image:url(https://raw.githubusercontent.com/wardashley001-lang/cdmx/main/brand/kit/patterns/checker-subtle-on-pink.png);background-size:180px 180px}
img.ph{display:block;object-fit:cover;position:absolute}
.logo{position:absolute;height:54px}
.eyebrow{font:700 24px "Syne";letter-spacing:.26em;text-transform:uppercase;color:var(--pink)}
.big{font:400 150px/.92 "Playfair Display";}
.big i,.h i,.q i{font-style:italic;color:var(--pink)}
.h{font:400 100px/.96 "Playfair Display";}
.q{font:400 104px/1.02 "Playfair Display";}
.line{font:400 34px/1.35 "DM Sans"}
.script{font:400 84px/1 "Mrs Saint Delafield";color:var(--pink)}
.pill{display:inline-flex;align-items:center;gap:14px;border:2px solid currentColor;border-radius:999px;padding:0 44px;height:84px;font:700 24px "Syne";letter-spacing:.2em;text-transform:uppercase}
.tag{display:inline-block;background:var(--cream);color:var(--deep);border-radius:999px;padding:16px 30px;font:700 22px "Syne";letter-spacing:.2em;text-transform:uppercase}
.abs{position:absolute}
.num{font-family:'Playfair Display';font-size:72px;line-height:1;font-weight:400;color:var(--pink);font-style:italic}
</style></head><body>

<!-- 1 COVER, photo on top, wine panel below -->
<section data-document-role="page" class="s wine">
  <img class="logo" src="https://raw.githubusercontent.com/wardashley001-lang/cdmx/main/brand/kit/logos/la-gueras-guide-pink-on-dark.png" style="left:72px;top:72px">
  <div class="abs h" style="font-family:'Playfair Display';left:72px;top:200px;width:936px;color:var(--rosa)">Three spots for <i>tacos.</i></div>
  <div class="abs" style="left:72px;top:520px;width:936px;display:flex;flex-direction:column;gap:70px">
    <div style="display:flex;gap:40px;align-items:baseline;border-top:2px solid rgba(247,202,216,.35);padding-top:34px"><span class="num" style="font-family:'Playfair Display'">01</span><div><div style="font-family:'Playfair Display';font-size:64px;line-height:1;font-weight:400;color:var(--rosa)">Spot name</div><div class="eyebrow" style="margin-top:16px">Colonia</div></div></div>
    <div style="display:flex;gap:40px;align-items:baseline;border-top:2px solid rgba(247,202,216,.35);padding-top:34px"><span class="num" style="font-family:'Playfair Display'">02</span><div><div style="font-family:'Playfair Display';font-size:64px;line-height:1;font-weight:400;color:var(--rosa)">Spot name</div><div class="eyebrow" style="margin-top:16px">Colonia</div></div></div>
    <div style="display:flex;gap:40px;align-items:baseline;border-top:2px solid rgba(247,202,216,.35);padding-top:34px"><span class="num" style="font-family:'Playfair Display'">03</span><div><div style="font-family:'Playfair Display';font-size:64px;line-height:1;font-weight:400;color:var(--rosa)">Spot name</div><div class="eyebrow" style="margin-top:16px">Colonia</div></div></div>
  </div>
  <div class="abs" style="left:658px;top:1164px;width:350px;height:130px"><img src="https://raw.githubusercontent.com/wardashley001-lang/cdmx/main/brand/kit/templates/carousel-set/sig-pink.png" style="width:350px;height:130px;display:block"></div>
</section>

<!-- 9 CLOSING / SAVE, wine checker -->
</body></html>
