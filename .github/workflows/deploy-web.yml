name: Deploy CDMX guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run qa:data
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Public form URL from the email service. Unset = the email signup section stays hidden.
          # Set it under Settings > Secrets and variables > Actions > Variables.
          VITE_EMAIL_FORM_ACTION: ${{ vars.VITE_EMAIL_FORM_ACTION }}
          # Link to buy the full guide. Unset = the "Get the guide" spots stay hidden. Same place as above.
          VITE_GUIDE_URL: ${{ vars.VITE_GUIDE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
